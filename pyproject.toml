[project]
name = "datatrace"
version = "0.1.0"
description = "Record-level data forensics and root-cause analysis for pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sreehari" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[project.scripts]
datatrace = "datatrace.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datatrace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["datatrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
